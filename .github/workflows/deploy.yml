name: Deploy FM Operations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Environment (wajib ketik: PRODUCTION)'
        required: true
        default: ''
      expected_account_id:
        description: 'Cloudflare Account ID FCMS (harus cocok dengan vars.EXPECTED_FCMS_ACCOUNT_ID)'
        required: true
        default: ''
      deploy_target:
        description: 'Komponen Production (terpisah — masing-masing butuh approval Owner tersendiri)'
        required: true
        type: choice
        options:
          - FRONTEND_ONLY
          - API_ONLY
        default: 'FRONTEND_ONLY'

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ============================================================
  # Validate — jalankan otomatis di setiap push, PR, & dispatch
  # (Tanpa akses Cloudflare, tanpa deployment Production)
  # ============================================================
  validate:
    name: ✅ Validate & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root deps (includes esbuild)
        run: npm install

      - name: Check required tracked files
        run: |
          test -f api/src/index.js           && echo "✅ api/src/index.js"
          test -f api/wrangler.toml          && echo "✅ api/wrangler.toml"
          test -f frontend/src/app.js        && echo "✅ frontend/src/app.js"
          test -f frontend/public/index.html && echo "✅ frontend/public/index.html"
          test -f schema/migrations.sql      && echo "✅ schema/migrations.sql"
          test -f build-root.js              && echo "✅ build-root.js"
          test -f scripts/preflight-guard.mjs && echo "✅ scripts/preflight-guard.mjs"

      - name: Verify fail-closed build & frontend build checks
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://fm-operations-api.facilitycare-audydental.workers.dev' }}
        run: |
          if grep -q -- '--env' build-root.js; then
            if node build-root.js; then
              echo "❌ FATAL: build-root.js harus menolak build tanpa --env/ENVIRONMENT eksplisit!"
              exit 1
            fi
            echo "✅ Build tanpa environment eksplisit ditolak (fail-closed)."

            ENVIRONMENT=staging API_BASE_URL=https://fm-operations-api-staging.facilitycare-audydental.workers.dev node build-root.js --env=staging
            grep -F "ENVIRONMENT: 'staging'" dist-staging/index.html
            grep -F "API_BASE_URL: 'https://fm-operations-api-staging.facilitycare-audydental.workers.dev'" dist-staging/index.html
            if grep -F "fm-operations-api.facilitycare-audydental.workers.dev" dist-staging/index.html; then
              echo "❌ FATAL: URL Worker Production bocor ke bundle Staging!"
              exit 1
            fi

            ENVIRONMENT=production API_BASE_URL="$API_BASE_URL" node build-root.js --env=production
            grep -F "ENVIRONMENT: 'production'" dist/index.html
            grep -F "API_BASE_URL: 'https://fm-operations-api.facilitycare-audydental.workers.dev'" dist/index.html
            if grep -iE "fm-operations-api-staging|fcvm" dist/index.html; then
              echo "❌ FATAL: URL Worker Staging/FCVM bocor ke bundle Production!"
              exit 1
            fi
          else
            echo "ℹ️ Legacy build-root.js terdeteksi pada base branch; menjalankan build standar."
            node build-root.js
            test -f dist/index.html && echo "✅ dist/index.html terbangun."
          fi

      - name: Run Deployment Hardening CI Suite
        run: node scripts/test_deployment_hardening.mjs --ci-only

  # ============================================================
  # Pre-flight Target Verification Gate (HANYA Manual Dispatch dari main)
  # Berhenti seketika jika target tidak sesuai resource FCMS
  # ============================================================
  preflight-target-check:
    name: 🛡️ Pre-flight Target & Account Verification Gate
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Dispatch Intent & Input Injection Safety
        env:
          INPUT_TARGET_ENV: ${{ github.event.inputs.target_environment }}
          INPUT_ACCOUNT_ID: ${{ github.event.inputs.expected_account_id }}
          INPUT_DEPLOY_TARGET: ${{ github.event.inputs.deploy_target }}
        run: |
          echo "=== 1. VERIFIKASI INTENT DISPATCH & SANITASI INPUT ==="
          if [ "$INPUT_TARGET_ENV" != "PRODUCTION" ]; then
            echo "❌ FATAL: Target environment input harus tepat 'PRODUCTION'. Dibatalkan."
            exit 1
          fi
          if [ -z "$INPUT_ACCOUNT_ID" ]; then
            echo "❌ FATAL: expected_account_id wajib diisi untuk verifikasi target. Dibatalkan."
            exit 1
          fi
          if [ "$INPUT_DEPLOY_TARGET" != "FRONTEND_ONLY" ] && [ "$INPUT_DEPLOY_TARGET" != "API_ONLY" ]; then
            echo "❌ FATAL: Target deployment tidak valid ($INPUT_DEPLOY_TARGET). Harus FRONTEND_ONLY atau API_ONLY agar approval terpisah. Dibatalkan."
            exit 1
          fi
          echo "✅ Intent manual dispatch terverifikasi (target: $INPUT_DEPLOY_TARGET)."

      - name: Verify Account ID against Independent Baseline (Fail-Closed)
        env:
          BASELINE_ACCOUNT_ID: ${{ vars.EXPECTED_FCMS_ACCOUNT_ID }}
          SECRET_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_ACCOUNT_ID: ${{ github.event.inputs.expected_account_id }}
        run: |
          echo "=== 2. VERIFIKASI AKUN TERHADAP BASELINE INDEPENDEN (FAIL-CLOSED) ==="

          if [ -z "$BASELINE_ACCOUNT_ID" ]; then
            echo "❌ FATAL: vars.EXPECTED_FCMS_ACCOUNT_ID belum dikonfigurasi di GitHub Repository Variables."
            exit 1
          fi

          if [ -z "$SECRET_ACCOUNT_ID" ]; then
            echo "❌ FATAL: secrets.CLOUDFLARE_ACCOUNT_ID belum dikonfigurasi di GitHub Secrets. Dibatalkan."
            exit 1
          fi

          if [ "$INPUT_ACCOUNT_ID" != "$BASELINE_ACCOUNT_ID" ]; then
            echo "❌ FATAL: expected_account_id dari input tidak cocok dengan vars.EXPECTED_FCMS_ACCOUNT_ID!"
            exit 1
          fi

          if [ "$SECRET_ACCOUNT_ID" != "$BASELINE_ACCOUNT_ID" ]; then
            echo "❌ FATAL: secrets.CLOUDFLARE_ACCOUNT_ID di repository tidak cocok dengan vars.EXPECTED_FCMS_ACCOUNT_ID!"
            exit 1
          fi

          echo "✅ Tiga faktor verifikasi akun (Input, Secret, dan Baseline Independen) cocok."

      - name: Configuration Assertion Gate (Pemeriksaan Integritas Berkas Statis)
        run: |
          echo "=== 3. CONFIGURATION ASSERTION GATE ==="
          node scripts/preflight-guard.mjs --env=production --authorize-production

          grep -E '^[[:space:]]*name[[:space:]]*=[[:space:]]*"fm-operations-api"[[:space:]]*$' api/wrangler.toml || exit 1
          grep -E '^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"293440e04e5d0c8073e7e2893750b527"[[:space:]]*$' api/wrangler.toml || exit 1
          grep -E '^[[:space:]]*database_name[[:space:]]*=[[:space:]]*"fcms-production-db"[[:space:]]*$' api/wrangler.toml || exit 1
          grep -E '^[[:space:]]*database_id[[:space:]]*=[[:space:]]*"62b4b6e5-a718-40bc-9aab-6a700b82a9c9"[[:space:]]*$' api/wrangler.toml || exit 1
          grep -E '^[[:space:]]*ENVIRONMENT[[:space:]]*=[[:space:]]*"production"[[:space:]]*$' api/wrangler.toml || exit 1
          grep -E '^[[:space:]]*SYNC_MODE[[:space:]]*=[[:space:]]*"DRY_RUN"[[:space:]]*$' api/wrangler.toml || exit 1
          grep -E '^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"293440e04e5d0c8073e7e2893750b527"[[:space:]]*$' frontend/wrangler.toml || exit 1
          grep -F -- '--project-name=facilitycare-system' .github/workflows/deploy.yml > /dev/null 2>&1 || exit 1
          echo "✅ Configuration Assertion Gate lolos."

      - name: Runtime Account Identity Verification (wrangler whoami)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_ACCOUNT_ID: ${{ vars.EXPECTED_FCMS_ACCOUNT_ID }}
        run: |
          echo "=== 4. VERIFIKASI IDENTITAS AKUN RUNTIME CLOUDFLARE ==="
          npm install -g wrangler@3 || npm install -g wrangler
          WHOAMI_OUTPUT=$(npx wrangler whoami 2>&1) || {
            echo "❌ FATAL: Gagal mengeksekusi wrangler whoami!"
            exit 1
          }
          if ! echo "$WHOAMI_OUTPUT" | grep -F "$BASELINE_ACCOUNT_ID" > /dev/null 2>&1; then
            echo "❌ FATAL: Output 'wrangler whoami' tidak mencocokkan Account ID baseline!"
            exit 1
          fi
          echo "✅ Identitas runtime Cloudflare terverifikasi cocok dengan baseline FCMS."

  # ============================================================
  # Deploy API ke Cloudflare Workers
  # WAJIB: Manual Dispatch dari main + Owner Approval (environment: production-worker)
  # ============================================================
  deploy-api:
    name: 🚀 Deploy Production Worker (Owner Approval Required)
    runs-on: ubuntu-latest
    needs: [validate, preflight-target-check]
    environment:
      name: production-worker
      url: https://fm-operations-api.facilitycare-audydental.workers.dev
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.deploy_target == 'API_ONLY'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Preflight Guard (Production Authorized)
        run: node scripts/preflight-guard.mjs --env=production --authorize-production

      - name: Install API deps
        run: npm install
        working-directory: api

      - name: Deploy Worker ke Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy

  # ============================================================
  # Deploy Frontend ke Cloudflare Pages
  # WAJIB: Manual Dispatch dari main + Owner Approval terpisah (environment: production-pages)
  # ============================================================
  deploy-pages:
    name: 🌐 Deploy Production Pages (Owner Approval Required)
    runs-on: ubuntu-latest
    needs: [validate, preflight-target-check]
    environment:
      name: production-pages
      url: https://facilitycare-system.pages.dev
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.deploy_target == 'FRONTEND_ONLY'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Preflight Guard (Production Authorized)
        run: node scripts/preflight-guard.mjs --env=production --authorize-production

      - name: Install root deps
        run: npm install

      - name: Build Frontend (Explicit Production)
        env:
          ENVIRONMENT: production
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          node build-root.js --env=production
          grep -F "ENVIRONMENT: 'production'" dist/index.html || exit 1
          grep -F "API_BASE_URL: 'https://fm-operations-api.facilitycare-audydental.workers.dev'" dist/index.html || exit 1
          if grep -iE "fm-operations-api-staging|fcvm" dist/index.html; then
            echo "❌ FATAL: Terdeteksi referensi Staging/FCVM di dist/index.html Production!"
            exit 1
          fi

      - name: Deploy ke Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=facilitycare-system --commit-dirty=true
