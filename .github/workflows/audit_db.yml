name: Audit DB
on:
  push:
    paths:
      - 'trigger_audit.txt'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and Analyze Data
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          curl -s "$API_BASE_URL/api/dashboard/reliever-audit" > dump.json
          node -e "
            const fs = require('fs');
            let data = [];
            try {
              const fileData = fs.readFileSync('dump.json', 'utf8');
              const json = JSON.parse(fileData);
              data = json.data || json;
            } catch(e) {
              console.error('Failed to parse JSON', e);
              process.exit(1);
            }
            
            function parseFlexibleDate(d) {
              if (!d || d === '-') return '';
              d = String(d).trim();
              if (/^\d{5}$/.test(d)) {
                const utc_days = Math.floor(Number(d) - 25569);
                const date_info = new Date(utc_days * 86400 * 1000);
                return date_info.toISOString().split('T')[0];
              }
              if (d.match(/^\d{2}[\/\-]\d{2}[\/\-]\d{4}$/)) {
                const p = d.split(/[\/\-]/);
                return \`\${p[2]}-\${p[1]}-\${p[0]}\`; 
              }
              return d.split('T')[0];
            }
            
            const julyData = [];
            for (const r of data) {
              const parsedDate = parseFlexibleDate(r.backup_date);
              if (parsedDate && parsedDate.startsWith('2026-07')) {
                if ((r.status || '').trim().toLowerCase() === 'done') {
                  julyData.push(r);
                }
              }
            }
            
            const seen = new Set();
            const duplicates = [];
            const misparsed = [];
            
            for (const r of julyData) {
              if (String(r.backup_date).includes('/08/2026') || String(r.backup_date).includes('-08-2026') || String(r.backup_date).toLowerCase().includes('agus')) {
                 misparsed.push(r);
              }
              const key = \`\${r.reliever_name}_\${r.backup_date}_\${r.branch_id}_\${r.shift}\`;
              if (seen.has(key)) {
                duplicates.push(r);
              } else {
                seen.add(key);
              }
            }
            
            let md = '# Audit Report\n\n';
            md += 'Total July Done: ' + julyData.length + '\n';
            md += 'Duplicates: ' + duplicates.length + '\n';
            md += 'Misparsed August: ' + misparsed.length + '\n\n';
            
            md += '## Duplicate Records\n';
            for (let i = 0; i < duplicates.length; i++) {
               md += \`- ID: \${duplicates[i].id}, Name: \${duplicates[i].reliever_name}, Date: \${duplicates[i].backup_date}, Branch: \${duplicates[i].branch_id}\n\`;
            }
            
            md += '\n## Misparsed August Records\n';
            for (let i = 0; i < misparsed.length; i++) {
               md += \`- ID: \${misparsed[i].id}, Name: \${misparsed[i].reliever_name}, Date: \${misparsed[i].backup_date}\n\`;
            }
            fs.writeFileSync('audit_results.md', md);
          "
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_results.md
          git commit -m "Auto-generate audit results" || true
          git push
