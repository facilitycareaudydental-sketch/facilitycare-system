name: Audit DB
on:
  push:
    paths:
      - 'trigger_audit.txt'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and Analyze Data
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          curl -s "$API_BASE_URL/api/dashboard/reliever-audit" > dump.json
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dump.json
          git commit -m "Auto-generate audit JSON dump" || true
          git push
